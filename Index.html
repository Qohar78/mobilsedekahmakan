<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#075b3b">
  
  <title>Mobil Sedekah Makan Gratis | MSM</title>
  <meta name="description" content="Bersama Mobil Sedekah Makan Gratis (MSM), hadirkan makanan siap santap bagi saudara-saudara kita yang membutuhkan.">
  
  <!-- Open Graph / Meta Preview untuk WhatsApp, Facebook, & Sosial Media -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Mobil Sedekah Makan Gratis | MSM">
  <meta property="og:description" content="Satu porsi dari kita, berarti bagi mereka. Gerakan berbagi makanan siap santap bagi dhuafa dan pekerja jalanan.">
  <meta property="og:image" content="https://i.ibb.co.com/ccZDd87f/1.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">

  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800;900&display=swap" rel="stylesheet">

  <style>
    /* Reset & Layar Penuh 100% */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #075b3b;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* Iframe Pembungkus Google Apps Script */
    #appFrame {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      background: #fbfdfb;
      z-index: 1;
    }

    /* Layar Splash Loading Halus (Anti White-Flash) */
    #splashScreen {
      position: fixed;
      inset: 0;
      z-index: 999;
      background: linear-gradient(135deg, #06472f, #08794a);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      padding: 20px;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    #splashScreen.fade-out {
      opacity: 0;
      visibility: hidden;
    }

    .splash-logo {
      width: 64px;
      height: 64px;
      background: #ffffff;
      color: #075b3b;
      border-radius: 20px;
      display: grid;
      place-items: center;
      font-size: 32px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
      margin-bottom: 20px;
      animation: pulse 1.8s infinite ease-in-out;
    }

    .splash-title {
      font-size: 20px;
      font-weight: 900;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
      text-align: center;
    }

    .splash-sub {
      font-size: 13px;
      color: #bde5cb;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 28px;
    }

    .spinner {
      width: 38px;
      height: 38px;
      border: 3.5px solid rgba(255, 255, 255, 0.2);
      border-top-color: #ffc928;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }
  </style>

  <!-- ==========================================================================
       KONFIGURASI URL GOOGLE APPS SCRIPT:
       Silakan tempelkan link URL Web App Google Apps Script Anda (akhiran /exec)
       pada variabel GAS_WEB_APP_URL di bawah ini:
       ========================================================================== -->
  <script>
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwYOUR_SCRIPT_ID_HERE/exec";
  </script>
</head>
<body>

  <!-- Layar Pembuka / Loading Splash Screen -->
  <div id="splashScreen">
    <div class="splash-logo" aria-hidden="true">♡</div>
    <div class="splash-title">MOBIL SEDEKAH MAKAN</div>
    <div class="splash-sub">Memuat Halaman Kebaikan...</div>
    <div class="spinner"></div>
  </div>

  <!-- Iframe Layar Penuh Pembungkus Web App -->
  <iframe
    id="appFrame"
    title="Mobil Sedekah Makan Gratis"
    allow="clipboard-write; clipboard-read; payment"
    allowfullscreen
  ></iframe>

  <script>
    (function() {
      const appFrame = document.getElementById("appFrame");
      const splashScreen = document.getElementById("splashScreen");

      // Penerusan parameter query URL (misal: ?ref=wa, ?utm_source=fb, dsb)
      const currentSearch = window.location.search || "";
      const currentHash = window.location.hash || "";
      
      let targetUrl = GAS_WEB_APP_URL;

      // Gabungkan query parameter jika ada
      if (currentSearch) {
        targetUrl += (targetUrl.includes("?") ? "&" : "?") + currentSearch.slice(1);
      }
      if (currentHash) {
        targetUrl += currentHash;
      }

      // Pasang URL ke Iframe
      appFrame.src = targetUrl;

      // Hilangkan splash screen saat iframe selesai memuat
      appFrame.addEventListener("load", function() {
        setTimeout(function() {
          splashScreen.classList.add("fade-out");
        }, 300);
      });

      // Fallback batas maksimal 4 detik jika koneksi lambat
      setTimeout(function() {
        splashScreen.classList.add("fade-out");
      }, 4000);
    })();
  </script>
</body>
</html>
